name: Package Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install local JARs to Maven repo
        run: |
          mvn install:install-file -Dfile=library/swing-toast-notifications-1.0.4.jar \
            -DgroupId=raven.toast -DartifactId=swing-toast-notifications -Dversion=1.0.3 -Dpackaging=jar
          mvn install:install-file -Dfile=library/swing-crazy-panel-1.0.0.jar \
            -DgroupId=raven.crazy-panel -DartifactId=swing-crazy-panel -Dversion=1.0.0 -Dpackaging=jar

      - name: Build and package
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: DACN-1-SNAPSHOT
          path: target/*.jar

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}

            ## Changes
            ${{ github.event.head_commit.message }}
          files: target/DACN-1-1.0-SNAPSHOT.jar
          generate_release_notes: true
